<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дзеркало 4K</title>
<style>
  :root { --bg:#0e1113; --fg:#eef2f3; --accent:#7fd6e8; --btn:#1d2428; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  video { width:100%; height:100%; object-fit:contain; transform:scaleX(-1); background:#000; }
  video.noflip { transform:none; }
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); background:linear-gradient(transparent, rgba(0,0,0,.75)); }
  button { background:var(--btn); color:var(--fg); border:1px solid #39444a; border-radius:12px;
    padding:12px 16px; font-size:16px; min-height:48px; }
  button:active { background:#2b363c; }
  button.on { border-color:var(--accent); color:var(--accent); }
  #info { position:fixed; top:0; left:0; right:0; padding:calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    font-size:14px; text-align:center; background:linear-gradient(rgba(0,0,0,.7), transparent); pointer-events:none; }
  #msg { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:24px; background:var(--bg); }
  #msg.hide { display:none; }
  #msg h1 { margin:0; font-size:26px; }
  #msg p { margin:0; max-width:32ch; color:#aeb9bd; line-height:1.5; }
  #start { background:var(--accent); color:#06282f; border:0; font-weight:600; padding:14px 28px; }
</style>
</head>
<body>
<div id="stage"><video id="v" autoplay playsinline muted></video></div>
<div id="info"></div>
<div id="bar">
  <button id="flip" class="on">Дзеркало: увімк</button>
  <button id="zoom">Зум ×1</button>
  <button id="bright">Яскравість</button>
  <button id="full">На весь екран</button>
</div>
<div id="msg">
  <h1>Дзеркало 4K</h1>
  <p>Натисни кнопку та дозволь доступ до фронтальної камери.</p>
  <button id="start">Увімкнути камеру</button>
  <p id="err"></p>
</div>
<script>
const v = document.getElementById('v'), info = document.getElementById('info');
const msg = document.getElementById('msg'), err = document.getElementById('err');
let stream = null, zoom = 1, light = 0;
const levels = [1, 1.5, 2], bright = [1, 1.25, 1.5];

async function start() {
  err.textContent = '';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'user' },
        width:  { ideal: 3840, min: 1280 },
        height: { ideal: 2160, min: 720 },
        frameRate: { ideal: 30 }
      }
    });
    v.srcObject = stream;
    await v.play();
    msg.classList.add('hide');
    const t = stream.getVideoTracks()[0];
    // спробувати безперервний автофокус
    try { await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
    const s = t.getSettings();
    info.textContent = 'Якість: ' + s.width + '×' + s.height + (s.width >= 3840 ? ' (4K)' : '') + ' · ' + (s.frameRate || '') + ' fps';
  } catch (e) {
    err.textContent = 'Не вдалося відкрити камеру: ' + (e.name || e.message) +
      '. Перевір дозвіл у налаштуваннях браузера й відкрий файл у Chrome/Safari.';
  }
}

function apply() {
  v.style.filter = 'brightness(' + bright[light] + ')';
  v.style.transform = (v.classList.contains('noflip') ? '' : 'scaleX(-1) ') + 'scale(' + zoom + ')';
}

document.getElementById('start').onclick = start;
document.getElementById('flip').onclick = e => {
  v.classList.toggle('noflip');
  e.target.classList.toggle('on');
  e.target.textContent = 'Дзеркало: ' + (v.classList.contains('noflip') ? 'вимк' : 'увімк');
  apply();
};
document.getElementById('zoom').onclick = e => {
  zoom = levels[(levels.indexOf(zoom) + 1) % levels.length];
  e.target.textContent = 'Зум ×' + zoom;
  apply();
};
document.getElementById('bright').onclick = () => { light = (light + 1) % bright.length; apply(); };
document.getElementById('full').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
};
</script>
</body>
</html>
